[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Electricity demand and weather data ingestion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["scikit-learn>=1.5,<2"]

[project.scripts]
gridcast-import = "gridcast.ingestion:main"
gridcast-baseline = "gridcast.baselines:main"

[tool.setuptools.packages.find]
where = ["src"]
