[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Electricity demand and weather data ingestion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gridcast-import = "gridcast.ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]
