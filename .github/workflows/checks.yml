name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-model-lock.txt -r requirements-runtime-lock.txt
          python -m pip install --no-deps -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build deterministic Lambda layer
        run: python scripts/build_arrow_layer.py
      - name: Validate Terraform without AWS access
        run: |
          terraform fmt -check -recursive infrastructure
          terraform -chdir=infrastructure/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/terraform validate
          terraform -chdir=infrastructure/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/bootstrap validate
      - name: Build model container and check non-root scratch storage
        run: |
          docker build --platform linux/amd64 -t gridcast-check .
          docker run --rm --read-only --cap-drop ALL --entrypoint python gridcast-check -c 'import os,tempfile; import gridcast.daily; assert os.getuid()==10001; tempfile.mkdtemp()'
