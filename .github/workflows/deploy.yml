name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements-*-lock.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - '.github/actions/**'
permissions:
  contents: read
concurrency:
  group: gridcast-production
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  AWS_DEFAULT_REGION: us-east-2
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      TF_VAR_alert_email: ${{ secrets.GRIDCAST_ALERT_EMAIL }}
      TF_VAR_forecast_model_sha256: ${{ vars.FORECAST_MODEL_SHA256 }}
      TF_VAR_schedule_enabled: 'true'
      TF_VAR_forecast_schedule_enabled: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce monthly deployment allowance before AWS access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.check_deployment_allowance
      - name: Validate release before requesting AWS credentials
        uses: ./.github/actions/validate
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gridcast-${{ github.run_id }}
          aws-region: us-east-2
          allowed-account-ids: '456112636403'
          role-duration-seconds: 3600
      - name: Build, publish and scan immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry=456112636403.dkr.ecr.us-east-2.amazonaws.com
          tag="git-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$registry/gridcast-model:$tag"
          aws ecr describe-images --repository-name gridcast-model > "$RUNNER_TEMP/ecr-images.json"
          python -c "import json; from scripts.check_cost_controls import POLICY, check_image_capacity; check_image_capacity(json.load(open('$RUNNER_TEMP/ecr-images.json'))['imageDetails'], json.loads(POLICY.read_text()))"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          docker tag gridcast-check "$image"
          test "$(docker image inspect "$image" --format '{{.Size}}')" -le 1073741824
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name gridcast-model --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_forecast_image_digest=$digest" >> "$GITHUB_ENV"
          docker buildx imagetools inspect --raw "$registry/gridcast-model@$digest" > "$RUNNER_TEMP/image-manifest.json"
          python scripts/check_image_scan.py --manifest "$RUNNER_TEMP/image-manifest.json" --digest "$digest"
      - name: Initialize shared state and verify model
        run: |
          terraform -chdir=infrastructure/terraform init -input=false -reconfigure -backend-config=backend.hcl -lockfile=readonly
          python scripts/verify_model_artifact.py --sha256 "$TF_VAR_forecast_model_sha256"
      - name: Plan and reject unexpected destruction
        run: |
          terraform -chdir=infrastructure/terraform plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/deployment.tfplan"
          terraform -chdir=infrastructure/terraform show -json "$RUNNER_TEMP/deployment.tfplan" > "$RUNNER_TEMP/deployment-plan.json"
          python scripts/check_deployment_plan.py "$RUNNER_TEMP/deployment-plan.json"
          python -m scripts.check_cost_controls "$RUNNER_TEMP/deployment-plan.json"
      - name: Apply the saved plan
        run: terraform -chdir=infrastructure/terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/deployment.tfplan"
      - name: Verify a real Fargate forecast
        env:
          EXPECTED_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python scripts/verify_release.py --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --image-digest "$EXPECTED_IMAGE_DIGEST" --model-sha256 "$TF_VAR_forecast_model_sha256"
      - name: Remove sensitive plan files
        if: always()
        run: rm -f "$RUNNER_TEMP/deployment.tfplan" "$RUNNER_TEMP/deployment-plan.json"
